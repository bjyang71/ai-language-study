<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>AI Language Study</title></head><body><header><h1>AI Language Study</h1><p>매일 조금씩, 여행에서 바로 쓰는 언어</p></header><main><section class="card hero"><h2>오늘의 학습</h2><div class="times"><span>🇺🇸 영어 15분</span><span>🇯🇵 일본어 8분</span><span>🇭🇰 광둥어 7분</span></div></section><section class="card"><h2>오늘의 문장</h2><div class="tabs"><button class="active" onclick="setLang('en',this)">🇺🇸 영어</button><button onclick="setLang('ja',this)">🇯🇵 일본어</button><button onclick="setLang('yue',this)">🇭🇰 광둥어</button></div><div id="lesson" class="lesson"></div><button class="speak" onclick="speakLesson()">🔊 문장 듣기</button></section><section class="card"><h2>내 문장 연습</h2><p class="hint">오늘의 문장을 직접 입력해 보세요.</p><textarea id="input" rows="3" placeholder="문장을 입력하세요"></textarea><button class="primary" onclick="checkSentence()">문장 확인</button><div id="feedback"></div></section><section class="card"><h2>오늘의 기록</h2><div class="progress"><div id="bar"></div></div><p id="status">오늘 0 / 3 과목 완료</p></section></main><footer>AI Language Study · 1차 버전</footer><script src="app.js"></script></body></html>
