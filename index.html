<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>AI Language Study V2</title></head><body>
<header><div><small>MY LANGUAGE COACH</small><h1>AI Language Study</h1><p>오늘도 30분, 여행에서 바로 말해요.</p></div><button onclick="toast('설정은 다음 버전에서 확장합니다.')">⚙️</button></header>
<main>
<section id="home" class="page on"><div class="hero"><span>오늘의 학습</span><h2>가볍게 시작해 볼까요? 😊</h2><p>🇺🇸 영어 15분 · 🇯🇵 일본어 8분 · 🇭🇰 광둥어 7분</p><button class="primary" onclick="openPage('chat')">오늘 학습 시작</button></div><div class="cards"><button onclick="startChat('en')">🇺🇸<b>영어</b><small>15분</small></button><button onclick="startChat('ja')">🇯🇵<b>일본어</b><small>8분</small></button><button onclick="startChat('yue')">🇭🇰<b>광둥어</b><small>7분</small></button></div><div class="card"><h3>홍콩 여행 30일</h3><p>번체자 · Jyutping · 한글 발음 · 뜻</p><button class="outline" onclick="openPage('travel')">오늘의 광둥어 보기 →</button></div></section>
<section id="chat" class="page"><button class="back" onclick="openPage('home')">‹ 홈</button><h2>🗣️ AI 회화</h2><div class="tabs"><button class="sel" onclick="startChat('en',this)">🇺🇸 영어</button><button onclick="startChat('ja',this)">🇯🇵 일본어</button><button onclick="startChat('yue',this)">🇭🇰 광둥어</button></div><div id="messages"></div><textarea id="answer" placeholder="답변을 입력하세요"></textarea><div class="actions"><button onclick="voice()">🎤</button><button class="primary" onclick="send()">답변 보내기</button></div></section>
<section id="travel" class="page"><button class="back" onclick="openPage('home')">‹ 홈</button><h2>✈️ 홍콩 여행 회화</h2><div class="travel card"><span id="day" class="tag">DAY 1</span><h2 id="yue"></h2><div id="jyutping"></div><div id="pron"></div><p id="meaning"></p><button class="outline" onclick="hearYue()">🔊 듣기</button> <button class="primary" onclick="nextYue()">다음</button></div><div class="card"><h3>상황 연습</h3><p>실제 홍콩 식당 상황처럼 연습합니다.</p><button class="outline" onclick="startChat('yue')">💬 상황 대화 시작</button></div></section>
<section id="progress" class="page"><button class="back" onclick="openPage('home')">‹ 홈</button><h2>📊 내 학습</h2><div class="stats"><div><b>1</b><small>학습 일수</small></div><div><b>30</b><small>오늘 목표(분)</small></div><div><b id="reviews">0</b><small>복습 문장</small></div></div><div class="card"><h3>복습 필요 문장</h3><div id="reviewList">아직 없습니다.</div></div></section>
</main><nav><button class="active" onclick="openPage('home',this)">🏠<small>홈</small></button><button onclick="openPage('chat',this)">🗣️<small>AI 회화</small></button><button onclick="openPage('travel',this)">✈️<small>여행</small></button><button onclick="openPage('progress',this)">📊<small>학습</small></button></nav><div id="toast"></div><script src="app.js"></script></body></html>
